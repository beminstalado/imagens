name: Copiar imagens
on:
  push:
    paths: ['lista.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar imagens com nome novo (arquivo original, sem compressao)
        run: |
          while IFS='|' read -r nome url || [ -n "$nome" ]; do
            url="${url%$'\r'}"
            [ -z "$nome" ] && continue
            [ -f "$nome" ] && continue
            curl -fsSL "$url" -o "$nome"
            echo "OK: $nome"
          done < lista.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Copia imagens da lista"
          git push
